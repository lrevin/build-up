# 자동 테스트: 실제 MySQL 대신 메모리 DB(H2)를 쓴다 → 내 DB를 건드리지 않고, GitHub Actions에서도 그대로 돈다
spring.datasource.url=jdbc:h2:mem:buildup;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# 메모리 DB(H2)는 MySQL 전용 SQL(Flyway)을 돌릴 수 없어서, 테스트에서는 엔티티로 표를 만든다
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# 테스트 계정·현장이 들어간 데모 데이터로 시작
buildup.seed-demo=true
buildup.upload-dir=build/test-uploads
buildup.firebase-key=build/no-firebase-key.json
buildup.jwt-secret=test-only-secret-key-0123456789-abcdefghij
# 가입 인증: 자동 테스트에서는 메일·문자를 실제로 보내지 않는다.
# 카카오는 로컬 bootTestRun에서 환경변수를 설정한 경우에만 실제 연동한다.
spring.mail.username=
buildup.sms.api-key=
buildup.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
buildup.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
buildup.kakao.app-id=${KAKAO_APP_ID:}
buildup.verification.sends-per-hour=1000
