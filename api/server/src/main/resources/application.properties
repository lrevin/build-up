spring.application.name=buildup-server

# 기본으로 local 설정(DB 비밀번호 등, git에 올리지 않는 파일)을 함께 읽는다
spring.profiles.active=local

# ---- DB(MySQL) ----
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/buildup_team?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=buildup
spring.datasource.password=${DB_PASSWORD:}
# 개발 중에는 엔티티에 맞춰 테이블을 자동으로 만들고 고친다(운영에서는 validate 권장)
# DB 구조는 팀 DB 설계(Flyway V1~V11, src/main/resources/db/migration)가 만들고, 서버는 구조가 맞는지만 확인한다
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
# 보고 목록을 불러올 때 사진·첨부 목록을 한 번에 모아서 읽는다(보고마다 따로 읽지 않게)
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# ---- 서버 ----
server.port=8080
# 업로드: 사진·첨부 파일 한 개당 20MB, 한 번에 최대 200MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=200MB

# 사진·첨부 파일 저장소: local(서버 폴더) | s3(AWS S3)
buildup.storage=local
# 사진 저장 폴더(서버 실행 폴더 기준, local일 때)
buildup.upload-dir=uploads
# 처음 실행할 때 DB가 비어 있으면 데모 데이터를 넣는다
buildup.seed-demo=true
# 로그인 유지 기간(일). 지나면 다시 로그인
# 접근 토큰(JWT) 유효 시간(분), 리프레시 토큰 유효 기간(일)
buildup.access-minutes=60
buildup.login-days=30
# 웹 대시보드 주소(쉼표로 여러 개). 개발 중에는 모두 허용
buildup.cors-origins=*
# 콘솔 로그 한글 깨짐 방지
logging.charset.console=UTF-8
# 휴대폰 알림 키 파일(Firebase 서비스 계정). 없으면 알림 없이 동작
buildup.firebase-key=firebase-key.json
# API 문서(Swagger): http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.paths-to-match=/api/**
