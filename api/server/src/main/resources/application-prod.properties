# 운영(https 배포) 설정: 실행할 때 --spring.profiles.active=prod
#   DB 주소·비밀번호는 환경 변수로 넣는다(파일에 적지 않음)
#     DB_URL=jdbc:mysql://DB주소:3306/buildup?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#     DB_USERNAME=buildup
#     DB_PASSWORD=...
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:buildup}
spring.datasource.password=${DB_PASSWORD}

# 운영에서는 데모 데이터를 넣지 않는다
buildup.seed-demo=false

# https 앞단(Nginx 등)을 거쳐 들어올 때 원래 주소(https://도메인)를 알아내
# 사진·첨부 파일 주소가 https로 만들어지게 한다
server.forward-headers-strategy=framework

# 웹 대시보드 주소만 허용(예: https://dashboard.buildup.kr)
buildup.cors-origins=${CORS_ORIGINS:https://localhost}

# 사진·첨부 파일 저장 폴더(서버에서 백업할 폴더)
buildup.upload-dir=${UPLOAD_DIR:uploads}

# 오류 응답에 서버 내부 정보를 싣지 않는다
server.error.include-stacktrace=never
server.error.include-message=never

# 휴대폰 알림 키 파일 위치(예: /opt/buildup/firebase-key.json, 권한 600)
buildup.firebase-key=${FIREBASE_KEY:firebase-key.json}

# API 문서는 운영에서 기본으로 끈다(발표·시연 때 API_DOCS=true로 켤 수 있음)
springdoc.api-docs.enabled=${API_DOCS:false}
springdoc.swagger-ui.enabled=${API_DOCS:false}

# 로그인 토큰(JWT) 서명 키: 32자 이상 무작위 값(환경 변수). 바꾸면 모두 다시 로그인
buildup.jwt-secret=${JWT_SECRET}

# 사진·첨부 파일 저장소: STORAGE=s3이면 AWS S3(버킷은 비공개, 앱에는 6시간짜리 임시 주소)
#   접속 키는 EC2 IAM 역할(권장) 또는 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 환경 변수
buildup.storage=${STORAGE:local}
buildup.s3.bucket=${S3_BUCKET:}
buildup.s3.region=${S3_REGION:ap-northeast-2}
buildup.s3.prefix=${S3_PREFIX:}

# 시스템 관리자 계정(처음 한 번 만들어짐). 가입 화면으로는 만들 수 없다
buildup.system-admin.email=${SYSTEM_ADMIN_EMAIL:}
buildup.system-admin.password=${SYSTEM_ADMIN_PASSWORD:}
