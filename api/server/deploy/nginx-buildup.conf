# Nginx 설정 예시: https(443)로 받아서 서버(8080)로 넘긴다
# 1) api.example.com 을 실제 도메인으로 바꾼다
# 2) 인증서는 certbot으로 발급: sudo certbot --nginx -d api.example.com
# 3) /etc/nginx/sites-available/buildup 으로 복사 → sites-enabled에 연결 → sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.example.com;
    # http로 들어오면 https로 보낸다
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # 사진 10장 + 첨부 5개를 한 번에 올리므로 서버 설정(200MB)과 맞춘다
    client_max_body_size 200m;
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
